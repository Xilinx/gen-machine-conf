ps7_cortexa9:
    properties:
      compatible:
        OneOf:
          - items:
            - const: arm,cortex-a9
    device_type: processor

psu_cortexa53:
    properties:
      compatible:
        OneOf:
          - items:
            - const: arm,cortex-a53
    device_type: processor

psv_cortexa72:
    properties:
      compatible:
        OneOf:
          - items:
            - const: arm,cortex-a72
    device_type: processor

psx_cortexa78:
    properties:
      compatible:
        OneOf:
          - items:
            - const: arm,cortex-a78
    device_type: processor

microblaze:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - pmu-microblaze
              - xlnx,microblaze-11.0
              - xlnx,microblaze
              - pmc-microblaze
              - psm-microblaze
    device_type: processor

ps7_ddr:
    device_type: memory

psu_ddr:
    device_type: memory

axi_emc:
    device_type: memory

sbsauart:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - arm,pl011
              - arm,sbsa-uart
    device_type: serial
    baudrate_editable: y
    earlycon: pl011,mmio32
    console_prefix: ttyAMA
    ip_name_aliases:
        - psv_sbsauart
        - psx_sbsauart
    firmware_console_alias:
        '0': pl011
        '1': pl011_1

psu_uart:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - cdns,uart-r1p12
              - xlnx,zynqmp-uart
            - enum:
              - cdns,uart-r1p8
              - xlnx,xuartps
    device_type: serial
    baudrate_editable: y
    earlycon: cdns,mmio32
    console_prefix: ttyPS
    firmware_console_alias:
        '0': cadence
        '1': cadence1

axi_uartlite:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - xlnx,axi-uartlite-2.0
              - xlnx,xps-uartlite-1.00.a
    device_type: serial
    earlycon: uartlite,mmio32
    console_prefix: ttyUL
    linux_console_file_name: ttyUL0

axi_uart16550:
    device_type: serial
    console_prefix: ttyS

mdm:
    device_type: serial
    console_prefix: ttyUL

psu_ethernet:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - xlnx,zynqmp-gem
              - cdns,zynqmp-gem
    device_type: ethernet

psv_ethernet:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - xlnx,versal-gem
              - cdns,versal-gem
              - cdns,gem
    device_type: ethernet


psv_pmc_sd:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - xlnx,versal-8.9a
              - arasan,sdhci-8.9a
    device_type: sd

psu_sd:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - xlnx,zynqmp-8.9a
              - arasan,sdhci-8.9a
    device_type: sd


psu_qspi:
    properties:
      compatible:
        OneOf:
          - items:
            - enum:
              - xlnx,zynqmp-qspi-1.0
            - enum:
              - xlnx,versal-qspi-1.0
    device_type: flash
    flash_type: spi
    flash_prefix: qspi

psv_pmc_qspi:
    properties:
      compatible:
        OneOf:
          - items:
             - enum:
               - xlnx,versal-qspi-1.0
             - enum:
               - xlnx,zynqmp-qspi-1.0
    device_type: flash
    flash_type: spi
    flash_prefix: qspi

psv_pmc_qspi_ospi:
    properties:
      compatible:
        OneOf:
          - items:
             - enum:
               - xlnx,versal-ospi-1.0
             - enum:
               - xlnx,zynqmp-ospi-1.0
    device_type: flash
    flash_type: spi
    flash_prefix: spi0

psx_pmc_qspi:
    properties:
      compatible:
        OneOf:
          - items:
             - enum:
               - xlnx,versal-qspi-1.0
             - enum:
               - xlnx,zynqmp-qspi-1.0
    device_type: flash
    flash_type: spi
    flash_prefix: qspi

psx_pmc_qspi_ospi:
    properties:
      compatible:
        OneOf:
          - items:
             - enum:
               - xlnx,versal-ospi-1.0
             - enum:
               - xlnx,zynqmp-ospi-1.0
    device_type: flash
    flash_type: spi
    flash_prefix: spi0

axi_quad_spi:
    properties:
      compatible:
        OneOf:
          - items:
             - enum:
               - xlnx,xps-spi-2.00.a
    device_type: flash
    flash_type: spi
    flash_prefix: spi0
